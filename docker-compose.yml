version: "3.9"

services:
  benchmark:
    build: .
    container_name: concurrency-bug-bench
    env_file:
      - .env
    volumes:
      - ./results:/app/results
    command: ["python", "run_eval.py", "--model", "mock-model", "--trials", "3"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: concurrency-bug-bench-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./results:/app/results
      - ./tasks:/app/tasks
      - ./reference:/app/reference
      - ./transcripts:/app/transcripts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: concurrency-bug-bench-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: concurrency-bug-bench-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.1
    container_name: concurrency-bug-bench-grafana
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
